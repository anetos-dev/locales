    password_changed: "Contraseña cambiada. Se ha cerrado tu sesión en tus otros navegadores y dispositivos."
    account_deleted: "Tu cuenta se ha eliminado."
    email_reverted: "Tu correo electrónico vuelve a ser {email}. Le hemos enviado un enlace para elegir una contraseña nueva."
