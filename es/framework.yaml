  periods: ["a. m.", "p. m."]
  date:
    short: "d/M/yy"
    medium: "d MMM y"
    long: "d 'de' MMMM 'de' y"
    full: "EEEE, d 'de' MMMM 'de' y"
  time:
    short: "H:mm"
    medium: "H:mm:ss"
    long: "H:mm:ss z"
    full: "H:mm:ss (zzzz)"
