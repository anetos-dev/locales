# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: locales
    steps:
      - uses: actions/checkout@v4
        with:
          path: locales
      # Until Anetos v0.3.0 is tagged, go.mod replaces it with ../anetos.
      - uses: actions/checkout@v4
        with:
          repository: anetos-dev/anetos
          path: anetos
      - uses: actions/setup-go@v5
        with:
          go-version-file: locales/go.mod
      - run: go vet ./...
      - run: go test ./...
