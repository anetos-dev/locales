# Anetos's own messages in Bangla (validation, error pages, sign-in,
# formats). Copied into an app by `anetos lang:add bn`; the app's copy is
# the app's to change.

validation:
  required: "{label} দিতে হবে।"
  required_if: "{0} যখন {1}, তখন {label} দিতে হবে।"
  required_unless: "{0} {1} না হলে {label} দিতে হবে।"
  required_with: "{list} থাকলে {label} দিতে হবে।"
  required_without: "{list} না থাকলে {label} দিতে হবে।"
  accepted: "{label} গ্রহণ করতে হবে।"
  min:
    string: "{label} কমপক্ষে {0} অক্ষরের হতে হবে।"
    numeric: "{label} কমপক্ষে {0} হতে হবে।"
    array: "{label}-এ কমপক্ষে {0}টি আইটেম থাকতে হবে।"
  max:
    string: "{label} {0} অক্ষরের বেশি হতে পারবে না।"
    numeric: "{label} {0}-এর বেশি হতে পারবে না।"
    array: "{label}-এ {0}টির বেশি আইটেম থাকতে পারবে না।"
  size:
    string: "{label} {0} অক্ষরের হতে হবে।"
    numeric: "{label} {0} হতে হবে।"
    array: "{label}-এ {0}টি আইটেম থাকতে হবে।"
  between:
    string: "{label} {0} থেকে {1} অক্ষরের মধ্যে হতে হবে।"
    numeric: "{label} {0} থেকে {1}-এর মধ্যে হতে হবে।"
    array: "{label}-এ {0} থেকে {1}টি আইটেম থাকতে হবে।"
  email: "{label} একটি সঠিক ইমেইল ঠিকানা হতে হবে।"
  url: "{label} একটি সঠিক URL হতে হবে।"
  uuid: "{label} একটি সঠিক UUID হতে হবে।"
  alpha: "{label}-এ শুধু অক্ষর থাকতে পারবে।"
  alpha_num: "{label}-এ শুধু অক্ষর ও সংখ্যা থাকতে পারবে।"
  alpha_dash: "{label}-এ শুধু অক্ষর, সংখ্যা, ড্যাশ ও আন্ডারস্কোর থাকতে পারবে।"
  ascii: "{label}-এ শুধু ASCII অক্ষর থাকতে পারবে।"
  numeric: "{label} একটি সংখ্যা হতে হবে।"
  integer: "{label} একটি পূর্ণসংখ্যা হতে হবে।"
  lowercase: "{label} ছোট হাতের অক্ষরে হতে হবে।"
  uppercase: "{label} বড় হাতের অক্ষরে হতে হবে।"
  starts_with: "{label} এগুলোর একটি দিয়ে শুরু হতে হবে: {list}।"
  ends_with: "{label} এগুলোর একটি দিয়ে শেষ হতে হবে: {list}।"
  ip: "{label} একটি সঠিক IP ঠিকানা হতে হবে।"
  json: "{label} একটি সঠিক JSON স্ট্রিং হতে হবে।"
  date: "{label} একটি সঠিক তারিখ (YYYY-MM-DD) হতে হবে।"
  datetime: "{label} একটি সঠিক তারিখ ও সময় (RFC 3339) হতে হবে।"
  in: "নির্বাচিত {label} সঠিক নয়।"
  not_in: "নির্বাচিত {label} সঠিক নয়।"
  distinct: "{label}-এ একই মান একাধিকবার আছে।"
  same: "{label} ও {0} মিলতে হবে।"
  different: "{label} ও {0} আলাদা হতে হবে।"
  confirmed: "{label} নিশ্চিতকরণের সাথে মিলছে না।"
  after: "{label} {0}-এর পরের তারিখ হতে হবে।"
  after_or_equal: "{label} {0} বা তার পরের তারিখ হতে হবে।"
  before: "{label} {0}-এর আগের তারিখ হতে হবে।"
  before_or_equal: "{label} {0} বা তার আগের তারিখ হতে হবে।"
  max_size: "{label} {0}-এর বেশি বড় হতে পারবে না।"
  min_size: "{label} কমপক্ষে {0} হতে হবে।"
  mimetypes: "{label} এই ধরনের ফাইল হতে হবে: {list}।"
  extensions: "{label}-এর এক্সটেনশন এগুলোর একটি হতে হবে: {list}।"
  image: "{label} একটি ছবি হতে হবে।"
  custom: "{label} সঠিক নয়।"
  values:
    now: "এখন"

