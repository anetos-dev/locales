auth:
  social_failed: "আপনাকে সাইন ইন করানো যায়নি। আবার চেষ্টা করুন।"
  social_account: "ওই অ্যাকাউন্ট দিয়ে আপনাকে সাইন ইন করানো যায়নি। আবার চেষ্টা করুন।"
  social_incomplete: "সাইন ইন সম্পূর্ণ হয়নি। আবার চেষ্টা করুন।"
