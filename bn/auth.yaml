# The account pages and emails of `anetos make:auth` in Bangla. Copied
# into an app that has them by `anetos lang:add bn`.
auth:
  fields:
    name: "নাম"
    email: "ইমেইল"
    password: "পাসওয়ার্ড"
    password_confirmation: "পাসওয়ার্ড নিশ্চিত করুন"
    new_password: "নতুন পাসওয়ার্ড"
  register:
    title: "নিবন্ধন"
    submit: "নিবন্ধন করুন"
    have_account: "আগেই নিবন্ধন করেছেন?"
  login:
    title: "লগ ইন"
    remember: "আমাকে মনে রাখুন"
    submit: "লগ ইন করুন"
  forgot:
    title: "পাসওয়ার্ড ভুলে গেছেন?"
    intro: "আপনার ইমেইল ঠিকানা দিন: নতুন পাসওয়ার্ড বেছে নেওয়ার একটি লিংক আমরা ইমেইলে পাঠাব।"
    submit: "রিসেট লিংক পাঠান"
  reset:
    title: "নতুন পাসওয়ার্ড বেছে নিন"
    submit: "পাসওয়ার্ড রিসেট করুন"
  dashboard:
    title: "ড্যাশবোর্ড"
    hello: "স্বাগতম, {name}"
    verify: "আপনার ইমেইল ঠিকানা যাচাই করুন: আমরা আপনাকে একটি লিংক ইমেইল করেছি।"
    resend: "লিংকটি আবার পাঠান"
    logout: "লগ আউট"
  tokens:
    title: "API টোকেন"
    new: "আপনার নতুন টোকেন (এখনই কপি করুন, এটি আর দেখানো হবে না):"
    revoke: "বাতিল করুন"
    name: "নাম"
    create: "টোকেন তৈরি করুন"
  social:
    sign_in_with: "{provider} দিয়ে সাইন ইন করুন"
  errors:
    name_required: "নাম দিতে হবে।"
    email_taken: "এই ইমেইল ঠিকানাটি আগেই ব্যবহার করা হয়েছে।"
    credentials: "এই তথ্য আমাদের রেকর্ডের সাথে মিলছে না।"
    disabled: "এই অ্যাকাউন্টটি নিষ্ক্রিয় করা হয়েছে।"
    throttled: "অনেকবার লগ ইনের চেষ্টা হয়েছে। এক মিনিট পরে আবার চেষ্টা করুন।"
    link_other_email: "এই লিংকটি অন্য একটি ইমেইল ঠিকানার জন্য।"
    too_many_emails: "অনেক বেশি ইমেইল পাঠানো হয়েছে। পরে আবার চেষ্টা করুন।"
    reset_invalid: "এই রিসেট লিংকটি সঠিক নয় বা এর মেয়াদ শেষ হয়েছে। নতুন একটি চেয়ে নিন।"
    social_no_email: "সেখানে আপনার অ্যাকাউন্টে কোনো যাচাই করা ইমেইল ঠিকানা নেই।"
    social_unverified: "এই ইমেইল ঠিকানার একটি অ্যাকাউন্ট আছে। আগে পাসওয়ার্ড দিয়ে লগ ইন করে ঠিকানাটি যাচাই করুন।"
    social_other_account: "এই ইমেইল ঠিকানার অ্যাকাউন্টটি সেখানকার অন্য একটি অ্যাকাউন্ট দিয়ে সাইন ইন করে।"
  status:
    verified: "আপনার ইমেইল ঠিকানা যাচাই করা হয়েছে।"
    verification_sent: "আমরা আপনাকে একটি নতুন যাচাই লিংক ইমেইল করেছি।"
    reset_sent: "ওই ঠিকানায় কোনো অ্যাকাউন্ট থাকলে, আমরা সেখানে একটি লিংক ইমেইল করেছি।"
    password_reset: "আপনার পাসওয়ার্ড রিসেট হয়েছে। এখন লগ ইন করতে পারেন।"
    token_revoked: "টোকেন বাতিল করা হয়েছে।"
  mail:
    hello: "প্রিয় {name},"
    verify:
      subject: "আপনার ইমেইল ঠিকানা যাচাই করুন"
      intro: "অনুগ্রহ করে আপনার ইমেইল ঠিকানা নিশ্চিত করুন:"
      button: "আমার ইমেইল ঠিকানা যাচাই করুন"
      ignore: "আপনি অ্যাকাউন্ট না খুলে থাকলে এই ইমেইলটি উপেক্ষা করুন।"
    reset:
      subject: "আপনার পাসওয়ার্ড রিসেট করুন"
      intro: "কেউ আপনার অ্যাকাউন্টের পাসওয়ার্ড রিসেট করতে চেয়েছে। সেটা আপনি হলে:"
      button: "নতুন পাসওয়ার্ড বেছে নিন"
      ignore: "লিংকটির মেয়াদ শীঘ্রই শেষ হবে, এবং এটি একবারই কাজ করবে। আপনি না চেয়ে থাকলে এই ইমেইলটি উপেক্ষা করুন: আপনার পাসওয়ার্ড যেমন আছে তেমনই থাকবে।"
