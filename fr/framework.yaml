  days_short: [dim., lun., mar., mer., jeu., ven., sam.]
  periods: [AM, PM]
  date:
    short: "dd/MM/y"
    medium: "d MMM y"
    long: "d MMMM y"
    full: "EEEE d MMMM y"
  time:
    short: "HH:mm"
    medium: "HH:mm:ss"
    long: "HH:mm:ss z"
    full: "HH:mm:ss zzzz"
  datetime:
    short: "{date} {time}"
    medium: "{date}, {time}"
    long: "{date} à {time}"
    full: "{date} à {time}"
  currency: "{amount} {symbol}" # a no-break space

relative:
  now: "à l'instant"
  past: "il y a {time}"
  future: "dans {time}"
